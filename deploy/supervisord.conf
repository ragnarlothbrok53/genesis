; ==== INFRA — do not edit unless you know supervisord ====
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[eventlistener:fatal_shutdown]
command=python3 /usr/local/bin/fatal_listener.py
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; >>> service:postgres
[program:postgres]
command=bash -c 'exec "$(ls -d /usr/lib/postgresql/*/bin | head -1)/postgres" -D /data/postgres'
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; <<< service:postgres
; >>> module:cache
; >>> service:valkey
[program:valkey]
command=/usr/local/bin/valkey-server --port 6379 --dir /data/valkey --save "" --appendonly no
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; <<< service:valkey
; <<< module:cache

; >>> module:jobs
; >>> service:temporal
[program:temporal-server]
command=/usr/local/bin/temporal server start-dev --ip 127.0.0.1 --port 7233 --ui-port 8233 --ui-public-path /temporal --db-filename /data/temporal/temporal.db --namespace default --log-level warn --ui-disable-news-fetch
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; <<< service:temporal
; <<< module:jobs

; >>> service:openobserve
[program:openobserve]
command=/usr/local/bin/openobserve
environment=ZO_DATA_DIR="/data/openobserve",ZO_BASE_URI="/o11y",ZO_HTTP_PORT="5080",ZO_ROOT_USER_EMAIL="%(ENV_O2_ROOT_EMAIL)s",ZO_ROOT_USER_PASSWORD="%(ENV_O2_ROOT_PASSWORD)s"
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; <<< service:openobserve

; >>> service:dbgate
[program:dbgate]
command=/usr/local/bin/node /home/dbgate-docker/bundle.js --listen-api
directory=/home/dbgate-docker
environment=HOME="/data/dbgate",PORT="3000",WEB_ROOT="/db",CONNECTIONS="pg",LABEL_pg="App Postgres",SERVER_pg="127.0.0.1",PORT_pg="5432",USER_pg="%(ENV_POSTGRES_USER)s",PASSWORD_pg="%(ENV_POSTGRES_PASSWORD)s",ENGINE_pg="postgres@dbgate-plugin-postgres"
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; <<< service:dbgate

[program:fastapi]
command=uv run --no-sync uvicorn genesis.main:app --host 127.0.0.1 --port 8000 --timeout-keep-alive 300
directory=/app/backend
environment=PYTHONPATH="/app/backend",HOME="/root"
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; >>> module:jobs
[program:temporal-worker]
command=uv run --no-sync python -m genesis.worker
directory=/app/backend
environment=PYTHONPATH="/app/backend"
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; <<< module:jobs

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

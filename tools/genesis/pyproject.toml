[project]
name = "genesis-cli"
version = "0.1.0"
description = "Assembles Genesis projects from modules"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
    "argcomplete>=3.0",
]

[project.scripts]
genesis = "genesis_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
